<!DOCTYPE html>
<html>
<head>
    <title>Chat API Test</title>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 600px; margin: 0 auto; }
        #result { border: 1px solid #ccc; padding: 10px; margin-top: 10px; white-space: pre-wrap; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
    </style>
</head>
<body>
    <h1>Chat API Test</h1>
    
    <h2>Test 1: Direct API call to localhost:3001</h2>
    <button onclick="testDirectAPI()">Test Direct API (Port 3001)</button>
    <div id="result1" class="result"></div>
    
    <h2>Test 2: Proxied API call through Vite</h2>
    <button onclick="testProxiedAPI()">Test Proxied API (/api/chat)</button>
    <div id="result2" class="result"></div>

    <script>
        async function testDirectAPI() {
            const result = document.getElementById('result1');
            result.textContent = 'Testing...';
            
            try {
                const response = await fetch('http://localhost:3001/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: 'Test from direct API call',
                        conversationHistory: []
                    })
                });
                
                const data = await response.json();
                result.className = 'result success';
                result.textContent = '✅ SUCCESS!\n\nStatus: ' + response.status + '\n\nResponse:\n' + JSON.stringify(data, null, 2);
            } catch (error) {
                result.className = 'result error';
                result.textContent = '❌ ERROR: ' + error.message;
            }
        }
        
        async function testProxiedAPI() {
            const result = document.getElementById('result2');
            result.textContent = 'Testing...';
            
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: 'Test from proxied API call',
                        conversationHistory: []
                    })
                });
                
                const data = await response.json();
                result.className = 'result success';
                result.textContent = '✅ SUCCESS!\n\nStatus: ' + response.status + '\n\nResponse:\n' + JSON.stringify(data, null, 2);
            } catch (error) {
                result.className = 'result error';
                result.textContent = '❌ ERROR: ' + error.message;
            }
        }
    </script>
    
    <style>
        .result { 
            border: 1px solid #ccc; 
            padding: 15px; 
            margin-top: 10px; 
            white-space: pre-wrap; 
            min-height: 50px;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</body>
</html>
